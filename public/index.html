<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas de Bolso</title>
<meta name="description" content="Planejador de viagens com IA: roteiro dia a dia, várias cidades e países, custos em dólar, mapa, guia e volta para casa.">
<meta name="theme-color" content="#F1F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A141B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atlas">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: planner/itinerary column on the left; full-bleed world map on the right with a floating detail card; tabs on phones. */
:root{
  --bg:#F1F5F4; --surface:#FFFFFF; --glass:rgba(255,255,255,.88); --sunken:#E7EEEC; --ink:#0F2230; --muted:#56687A; --line:#D5DFDD;
  --accent:#0B6B78; --accent-ink:#FFFFFF; --accent-soft:#D7ECEF;
  --coral:#D9512F; --coral-soft:#FBE4DC; --sun:#EBA300; --sun-soft:#FCEFC9;
  --ok:#1C7C3A; --ok-soft:#DDF1E3; --warn:#9A5B00; --warn-soft:#FBEBCD; --bad:#B42318; --bad-soft:#FBE0DC;
  --sea:#D5E6EC; --land:#F9FBF9; --coast:#AFC6CD; --land-hi:#FBEBC0; --grid:rgba(15,34,48,.07); --map-label:rgba(255,255,255,.94);
  --d1:#2563A8; --d2:#C2410C; --d3:#7C3AED; --d4:#0E7C66; --d5:#B4235A; --d6:#8A6D00; --d7:#3F6212;
  --pin-ink:#FFFFFF;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(15,34,48,.06),0 8px 28px rgba(15,34,48,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A141B; --surface:#111F28; --glass:rgba(17,31,40,.86); --sunken:#0D1920; --ink:#E6EEF1; --muted:#90A4AE; --line:#203340;
  --accent:#4CC2CF; --accent-ink:#04232A; --accent-soft:#12323A;
  --coral:#FF8466; --coral-soft:#3A1E17; --sun:#F6C14F; --sun-soft:#3A3115;
  --ok:#6BCB86; --ok-soft:#163222; --warn:#E8AE52; --warn-soft:#3A2A10; --bad:#F2847A; --bad-soft:#3D1A17;
  --sea:#081720; --land:#142630; --coast:#2B4554; --land-hi:#2F2C17; --grid:rgba(230,238,241,.05); --map-label:rgba(17,31,40,.94);
  --d1:#6EA8FF; --d2:#FB8A4C; --d3:#B69CFF; --d4:#3FD1AE; --d5:#F472A8; --d6:#E2C044; --d7:#9BD45B; --pin-ink:#08141A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A141B; --surface:#111F28; --glass:rgba(17,31,40,.86); --sunken:#0D1920; --ink:#E6EEF1; --muted:#90A4AE; --line:#203340;
  --accent:#4CC2CF; --accent-ink:#04232A; --accent-soft:#12323A;
  --coral:#FF8466; --coral-soft:#3A1E17; --sun:#F6C14F; --sun-soft:#3A3115;
  --ok:#6BCB86; --ok-soft:#163222; --warn:#E8AE52; --warn-soft:#3A2A10; --bad:#F2847A; --bad-soft:#3D1A17;
  --sea:#081720; --land:#142630; --coast:#2B4554; --land-hi:#2F2C17; --grid:rgba(230,238,241,.05); --map-label:rgba(17,31,40,.94);
  --d1:#6EA8FF; --d2:#FB8A4C; --d3:#B69CFF; --d4:#3FD1AE; --d5:#F472A8; --d6:#E2C044; --d7:#9BD45B; --pin-ink:#08141A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{font-size:12.5px;color:var(--muted);margin:0}
.lbl{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;z-index:6}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.02em;font-style:italic}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;line-height:1}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:500;font-size:13px;white-space:nowrap;transition:border-color .15s,background .15s,transform .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.big{padding:12px 20px;font-size:15px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.icon{padding:7px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--sunken)}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;font-family:var(--f-mono)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.usage{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* shell */
.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,500px) minmax(0,1fr)}
.pane{min-width:0;min-height:0}
.left{overflow:auto;background:var(--bg);border-right:1px solid var(--line)}
.right{position:relative;min-height:0}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs .tab-map{display:none}
.view{padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:16px}

/* jobs */
.jobs{display:flex;flex-direction:column;gap:8px}
.jobs:empty{display:none}
.job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.job-row{display:flex;align-items:center;gap:10px}
.job-row b{flex:1;min-width:0;font-size:13.5px}
.bar{height:3px;border-radius:3px;background:var(--sunken);overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;inset:0 auto 0 0;width:35%;background:linear-gradient(90deg,var(--accent),var(--coral));border-radius:3px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{left:-35%}100%{left:100%}}
.found{display:flex;flex-wrap:wrap;gap:6px}
.found span{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:999px;animation:pop .3s ease-out}
@keyframes pop{from{transform:translateY(4px);opacity:.2}}

/* planner */
.thread{display:flex;flex-direction:column;gap:16px}
.q{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:14px}
.q.answered .avatar{background:var(--accent);color:var(--accent-ink)}
.q-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.ask{font-family:var(--f-display);font-size:18px;font-weight:500}
.reply{background:var(--surface);border:1px solid var(--line);border-radius:4px var(--r) var(--r) var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--r-sm);padding:9px 11px;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:140px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg);overflow:hidden;flex:none !important;min-width:0 !important}
.stepper button{border:0;background:transparent;width:32px;height:36px;font-size:17px}
.stepper output{min-width:58px;text-align:center;font-family:var(--f-mono);font-size:13px;font-weight:500}
.toggle{display:flex;gap:10px;align-items:center;font-size:13.5px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.dest{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--bg)}
.dest-n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:11.5px;margin-top:6px}
.dest-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.dest-f .input{background:var(--surface)}
.dest-f .row{align-items:center}
.dest-ops{display:flex;flex-direction:column;gap:2px}
.dest-ops .btn{padding:5px}
.hopline{display:flex;align-items:center;gap:8px;margin-left:11px;padding:2px 0 2px 21px;border-left:2px dashed var(--coral);color:var(--coral);font-size:12px;font-weight:500}
.cta{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.cta .row>*{flex:1 1 180px}

/* hero / journey */
.hero{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 0%,var(--accent-soft),transparent 60%);opacity:.7;pointer-events:none}
.hero>*{position:relative}
.hero-code{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hero h2{font-size:30px;line-height:1.08;font-weight:600}
.hero h2 em{font-style:italic;font-weight:500;color:var(--accent)}
.journey{overflow-x:auto;margin:0 -18px;padding:4px 18px 6px;scrollbar-width:thin}
.stations{display:flex;align-items:stretch;gap:0;min-width:max-content}
.station{border:0;background:transparent;text-align:left;display:flex;flex-direction:column;gap:1px;padding:8px 10px;border-radius:12px;position:relative}
.station:hover{background:var(--sunken)}
.station[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.station[aria-pressed="true"] .cc,.station[aria-pressed="true"] .nights{color:inherit;opacity:.75}
.station .cc{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted)}
.station .city{font-family:var(--f-display);font-style:italic;font-size:20px;font-weight:500;line-height:1.1;white-space:nowrap}
.station .nights{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.hop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:92px;padding:0 4px;color:var(--coral);font-size:11px;font-weight:600;position:relative}
.hop::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--coral);opacity:.55}
.hop>*{position:relative;background:var(--surface);padding:0 5px;border-radius:6px;white-space:nowrap}
.hop .mono{font-size:10.5px;color:var(--muted);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.stats div{display:flex;flex-direction:column;gap:1px;min-width:0}
.stats b{font-family:var(--f-mono);font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:11px;color:var(--muted)}
.fx{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:11.5px;color:var(--muted)}
.fx .mono{color:var(--ink);font-size:11.5px}
.fx button{border:0;background:none;color:var(--accent);font-weight:600;font-size:11.5px;padding:0}
.fxedit{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px}
.fxedit input{width:110px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--bg);font-family:var(--f-mono);font-size:12px}
.banner{display:flex;gap:10px;align-items:center;background:var(--sun-soft);color:var(--warn);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;flex-wrap:wrap}
.banner .btn{margin-left:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.addbar{display:flex;gap:8px}
.addbar .input{flex:1;background:var(--surface)}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.daytabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.daytabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.daytabs small{font-weight:500;opacity:.7}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}

/* timeline */
.day{display:flex;flex-direction:column}
.day-head{display:flex;align-items:flex-end;gap:10px;margin-bottom:6px}
.day-head .grow{flex:1;min-width:0}
.day-n{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);font-weight:500}
.day-head h3{font-size:19px;font-weight:600}
.day-meta{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tl{display:grid;grid-template-columns:46px 20px minmax(0,1fr);column-gap:8px}
.tl-time{font-family:var(--f-mono);font-size:12px;font-weight:500;padding-top:14px;text-align:right}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::before{content:"";position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);border-left:2px solid var(--c);opacity:.35}
.tl.leg .tl-rail::before{border-left-style:dashed;opacity:.7}
.tl.leg.solid .tl-rail::before{border-left-style:solid}
.tl-node{position:relative;margin-top:11px;width:20px;height:20px;border-radius:50%;background:var(--c);color:var(--pin-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;font-weight:500;box-shadow:0 0 0 3px var(--bg)}
.tl-node.home{border-radius:6px;background:var(--ink);color:var(--bg)}
.tl-node.home .ico{width:12px;height:12px}
.origin{font-size:13px;color:var(--muted);padding:12px 0 6px;display:flex;gap:6px;align-items:center;min-width:0}
.leg-box{padding:6px 0 8px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;min-width:0}
.leg-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leg-line .mono{font-size:11.5px}
.leg select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 6px;font-size:12px}
.leg a{color:var(--accent);font-weight:500;text-decoration:none;font-size:12px}
.leg a:hover{text-decoration:underline}
.est{font-size:10px;color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;margin:4px 0;transition:border-color .15s,box-shadow .15s,transform .15s}
.stop:hover{transform:translateX(2px)}
.stop.sel{border-color:var(--sun);box-shadow:0 0 0 3px color-mix(in srgb,var(--sun) 25%,transparent)}
.stop-body{display:flex;flex-direction:column;gap:3px;min-width:0}
.stop-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stop h4{margin:0;font-size:15px;font-weight:600}
.stop p{margin:0;font-size:13px;color:var(--muted)}
.type{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.caution{background:var(--warn-soft);color:var(--warn)}
.pill.avoid{background:var(--bad-soft);color:var(--bad)}
.ops{display:flex;flex-direction:column;gap:2px}
.ops .btn{padding:5px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:0;display:inline-flex;gap:5px;align-items:center}
.m{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.m b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.m small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

/* transfer ticket */
.xfer{margin:14px 0;border-radius:16px;background:var(--surface);border:1px solid color-mix(in srgb,var(--coral) 45%,var(--line));box-shadow:var(--shadow);overflow:hidden}
.xfer-head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:linear-gradient(90deg,var(--coral-soft),transparent)}
.xfer-head .ico{color:var(--coral);width:20px;height:20px}
.xfer-route{flex:1;min-width:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-style:italic;font-size:18px;font-weight:500}
.xfer-route span.arrow{font-style:normal;color:var(--coral);font-family:var(--f-mono);font-size:14px}
.xfer-opts{display:flex;flex-direction:column}
.xopt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 14px;border-top:1px dashed var(--line);cursor:pointer;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%}

case "metro":return Math.round(8+km*2.4);case "bus":case "tram":return Math.round(8+km*3.4);
case "train":return Math.round(12+km*1.1);case "car":case "taxi":return Math.round(6+km*(km>30?0.9:2.2));
case "boat":return Math.round(15+km*3);case "plane":return Math.round(150+km/12);default:return Math.round(km*13)}}
function pickMode(km,allowed){const a=allowed&&allowed.length?allowed:["walk","metro","bus","taxi"];

  const ctl=new AbortController();const job={label,chars:0,names:[],ctl};S.jobs.set(key,job);renderJobs();refreshFor(key);

async function suggestPlaces(){const tr=S.trip;if(!tr)return;const bi=Math.max(0,targetBase());const b=tr.bases[bi];const names=tr.days.filter(d=>d.base===bi).flatMap(d=>d.stops.map(s=>s.name)).join("; ");
  const p=`Responda SOMENTE com um array JSON, textos em ${LANG_NAME()}. Liste 6 atrações muito visitadas ou imperdíveis em ${b.city}, ${b.country} que NÃO estejam nesta lista: ${names||"nenhuma"}. Interesses do viajante: ${S.form.interests.join(", ")}.

function insertStop(d,dayIdx){const tr=S.trip;const day=tr.days[Math.max(0,Math.min(dayIdx,tr.days.length-1))];if(!day)return;
  const s={id:"s"+uid(),name:str(d.name,90),type:TYPES.includes(d.type)?d.type:"sight",lat:num(d.lat),lng:num(d.lng),time:null,dur:num(d.dur)??60,cost:num(d.cost)??0,note:str(d.note||d.why,200),safety:"ok",leg:{fromId:"x"}};

function findStop(id){if(!S.trip||!id)return null;for(let d=0;d<S.trip.days.length;d++){const i=S.trip.days[d].stops.findIndex(s=>s.id===id);if(i>=0)return{day:S.trip.days[d],dayIdx:d,idx:i,stop:S.trip.days[d].stops[i]}}return null}
function moveStop(id,dir){const f=findStop(id);if(!f)return;const j=f.idx+dir;if(j<0||j>=f.day.stops.length)return;const a=f.day.stops;[a[f.idx],a[j]]=[a[j],a[f.idx]];fixLegs(f.day);persist();renderAll()}
function removeStop(id){const f=findStop(id);if(!f)return;f.day.stops.splice(f.idx,1);if(!f.day.stops.length){S.trip.days.splice(f.dayIdx,1);relabel(S.trip)}else fixLegs(f.day);
  if(S.selected===id)S.selected=null;if(S.dayIdx>=S.trip.days.length)S.dayIdx=-1;persist();renderAll()}
function optimizeDay(di){const day=S.trip.days[di];if(!day||day.stops.length<3)return;const first=day.stops[0].time;
  const rest=day.stops.slice();const out=[];let cur=startOf(day);while(rest.length){let bi=0,bd=Infinity;rest.forEach((s,i)=>{const dd=hav(cur,s);if(dd<bd){bd=dd;bi=i}});cur=rest.splice(bi,1)[0];out.push(cur)}
  day.stops=out;out[0].time=first;fixLegs(day);persist();renderAll()}
function setLegMode(id,mode){const f=findStop(id);if(!f||!MODES.includes(mode))return;const l=f.stop.leg;l.mode=mode;l.min=legTime(mode,l.km);l.cost=mode==="walk"||mode==="bike"?[0,0]:null;l.how="";l.est=true;retime(f.day);persist();renderAll()}
function tripStats(tr){const R={km:0,n:0,local:[0,0],xfer:[0,0],entries:0,food:0,unk:0,noRate:0,byMode:{},countries:new Set(tr.bases.filter(b=>!b.pending).map(b=>b.country))};
  const add=(arr,r,cur)=>{const a=toUSD(r[0],cur),b=toUSD(r[1],cur);if(a==null){R.noRate++;return}arr[0]+=a;arr[1]+=b};
  tr.days.forEach(d=>{const cur=baseOf(d).currency;d.stops.forEach(s=>{R.n++;R.km+=s.leg.km||0;const c=toUSD(s.cost||0,cur);if(c==null)R.noRate++;else if(s.type==="food")R.food+=c;else R.entries+=c;
    const b=R.byMode[s.leg.mode]||(R.byMode[s.leg.mode]={lo:0,hi:0,min:0});b.min+=s.leg.min||0;if(s.leg.cost){const x=[0,0];add(x,s.leg.cost,cur);R.local[0]+=x[0];R.local[1]+=x[1];b.lo+=x[0];b.hi+=x[1]}else R.unk++})});
  tr.transfers.forEach(x=>{const o=chosenOpt(x);if(!o||!o.cost)return;const cur=o.currency||tr.bases[x.from]?.currency;const y=[0,0];add(y,o.cost,cur);R.xfer[0]+=y[0];R.xfer[1]+=y[1];
    const b=R.byMode["x_"+o.mode]||(R.byMode["x_"+o.mode]={lo:0,hi:0,min:0,x:true,mode:o.mode});b.lo+=y[0];b.hi+=y[1];b.min+=(o.hours||0)*60});
  R.total=[R.local[0]+R.xfer[0]+R.entries+R.food,R.local[1]+R.xfer[1]+R.entries+R.food];return R}
function dayStats(d){const cur=baseOf(d).currency;let km=0,lo=0,hi=0,min=0;d.stops.forEach(s=>{km+=s.leg.km||0;min+=s.leg.min||0;if(s.leg.cost){const a=toUSD(s.leg.cost[0],cur),b=toUSD(s.leg.cost[1],cur);if(a!=null){lo+=a;hi+=b}}});return{km,lo,hi,min}}
const tripCurrencies=tr=>[...new Set([...tr.bases.filter(b=>!b.pending).map(b=>b.currency),...tr.transfers.flatMap(x=>x.options.map(o=>o.currency).filter(Boolean))])].filter(c=>c&&c!=="USD");

function optRow(o,on,fallbackCur,attrs,best){const cur=o.currency||fallbackCur;return `<button class="xopt" ${attrs} aria-pressed="${on}"><span class="radio"></span><span style="min-width:0"><b>${ico(o.mode)}${esc(o.title)}${best?` <span class="pill ok">${esc(t("rBest"))}</span>`:""}</b><p>${esc(o.how)}</p>${o.book?`<p>${ico("info")} ${esc(o.book)}</p>`:""}</span><span class="right-col">${moneyRange(o.cost,cur)}${o.hours!=null?`<span class="mono">${esc(dur(o.hours*60))}</span>`:""}</span></button>`}
function viewDay(d,i){const c=`var(${DAYC[i%7]})`;const ds=dayStats(d);const b=baseOf(d),cur=b.currency;const st=b.start;

function viewHome(){const tr=S.trip,h=S.home;const opts=[["auto",tr.bases[tr.bases.length-1].start.name||tr.bases[tr.bases.length-1].city]].concat(tr.bases.slice(0,-1).map((b,i)=>["base:"+i,b.start.name||b.city])).concat(tr.days.flatMap(d=>d.stops.map(s=>[s.id,d.label+" · "+s.name]))).concat([["custom",t("custom")]]);

async function exportPDF(data){
  if(!data||!data.trip)return;if(S.pdfBusy)return;S.pdfBusy=true;toast(t("pdfMaking"));
  let bytes=null;const keep=S.trip;
  try{await loadPdfLib();S.trip=upgradeTrip(data.trip);bytes=await buildPDF({...data,trip:S.trip})}
  catch(e){console.error(e);toast(t(e&&e.code==="pdflib"?"pdfLibFail":"pdfFail"));S.pdfBusy=false;S.trip=keep;return}
  finally{S.trip=keep}
  const name="atlas-"+(data.trip.title||"roteiro").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase()+".pdf";
  try{const blob=new Blob([bytes],{type:"application/pdf"});const file=new File([blob],name,{type:"application/pdf"});
    const mobile=matchMedia("(pointer: coarse)").matches;
    if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:data.trip.title||"Atlas de Bolso"});toast(t("pdfSaved"));return}catch(e){if(e&&e.name==="AbortError")return}}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast(t("pdfSaved"))}
  catch(e){toast(t("pdfFail"))}
  finally{S.pdfBusy=false}}
